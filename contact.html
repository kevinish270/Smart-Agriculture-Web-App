<html >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - AgriSmart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AgriSmart</h1>
        <nav>
            <a href="index.html">Project Idea</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="container">
        <div class="form-card">
            <h2>Get Involved</h2>
            <form action="#">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="role">Identify As</label>
                    <select id="role" name="role">
                        <option value="farmer">Farmer</option>
                        <option value="buyer">Buyer/Trader</option>
                        <option value="partner">Potential Partner</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required>
                </div>

                <div class="form-group">
                    <label for="message">How can we help you?</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tell us about your needs..."></textarea>
                </div>

                <button type="submit">Submit Information</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 225074650 ISHIMWE NIYOYITA Kevin</p>
    </footer>

</body>
</html>
